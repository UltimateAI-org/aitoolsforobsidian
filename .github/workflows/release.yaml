name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag_name: ${{ steps.validate.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history to find the previous release

      - name: Validate version
        id: validate
        run: |
          set -euo pipefail

          manifest_version=$(node -p "require('./manifest.json').version")
          package_version=$(node -p "require('./package.json').version")

          # 1. manifest.json and package.json must agree
          if [ "$manifest_version" != "$package_version" ]; then
            echo "::error::manifest.json ($manifest_version) and package.json ($package_version) disagree"
            exit 1
          fi

          # 2. the tag being released must match the committed version
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$manifest_version"
          fi

          if [ "$tag" != "v$manifest_version" ]; then
            echo "::error::Tag '$tag' does not match manifest version 'v$manifest_version'"
            exit 1
          fi

          # 3. versions.json must carry an entry for this release
          if ! node -e "process.exit(require('./versions.json')['$manifest_version'] ? 0 : 1)"; then
            echo "::error::versions.json has no entry for $manifest_version (run 'npm version' rather than editing by hand)"
            exit 1
          fi

          # 4. the version must be a legal successor of the last release.
          #    A plain "must be greater" check is not enough: 0.70.0 is
          #    semver-greater than 0.9.7, which is how v0.70.0 shipped by
          #    mistake (it was the claude-agent-acp ceiling, not a plugin
          #    version). Only patch+1, minor+1, or major+1 are accepted.
          previous=$(git tag --list 'v*' --sort=-v:refname             | grep -v "^$tag$"             | head -n 1             | sed 's/^v//')

          if [ -z "$previous" ]; then
            echo "No previous release tag found; skipping successor check"
          else
            if ! node -e "
              const [pa,pb,pc] = '$previous'.split('.').map(Number);
              const next = new Set([
                [pa, pb, pc + 1].join('.'),
                [pa, pb + 1, 0].join('.'),
                [pa + 1, 0, 0].join('.'),
              ]);
              if (!next.has('$manifest_version')) {
                console.error(
                  'Version $manifest_version is not a legal successor of $previous. ' +
                  'Expected one of: ' + [...next].join(', ')
                );
                process.exit(1);
              }
            "; then
              echo "::error::Refusing to release $manifest_version after $previous"
              exit 1
            fi
            echo "Successor check passed: $previous -> $manifest_version"
          fi

          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "Validated: version '$manifest_version' using tag '$tag'"

  build:
    name: Build and release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/

      - name: Build
        run: npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag_name }}
        run: |
          # Create release notes from commits since last tag
          previous_tag=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$previous_tag" ]; then
            changelog=$(git log "$previous_tag"..HEAD --pretty=format:"- %s" 2>/dev/null | head -20)
          else
            changelog=$(git log --pretty=format:"- %s" | head -20)
          fi

          cat <<EOF > /tmp/release-notes.md
          ## Changes
          $changelog

          ## Files
          - main.js
          - manifest.json
          - styles.css
          EOF

          # Create release (use --overwrite if you want to update existing releases)
          gh release create "$TAG" \
            --title="$TAG" \
            --notes-file /tmp/release-notes.md \
            main.js manifest.json styles.css
          
          echo "Release '$TAG' created successfully"
